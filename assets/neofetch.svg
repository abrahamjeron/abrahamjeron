    <text x="300" y="155.5" opacity="1"><tspan fill="#7B61FF">OS:</tspan><tspan fill="#3B4A80"> ......................... </tspan><tspan fill="#C9D6FF">Ubuntu Linux · Windows · macOS</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.30s" fill="freeze"/></text>
    <text x="300" y="175.0" opacity="1"><tspan fill="#7B61FF">Uptime:</tspan><tspan fill="#3B4A80"> ....................... </tspan><tspan fill="#C9D6FF">3 years building for the web</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.37s" fill="freeze"/></text>
    <text x="300" y="194.5" opacity="1"><tspan fill="#7B61FF">Host:</tspan><tspan fill="#3B4A80"> ..................................... </tspan><tspan fill="#C9D6FF">Bangalore, India</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.45s" fill="freeze"/></text>
