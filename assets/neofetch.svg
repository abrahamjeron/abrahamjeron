    <text x="300" y="233.5" opacity="1"><tspan fill="#7B61FF">Kernel:</tspan><tspan fill="#3B4A80"> .................................. </tspan><tspan fill="#C9D6FF">Software Engineer</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.60s" fill="freeze"/></text>
    <text x="300" y="253.0" opacity="1"><tspan fill="#7B61FF">Editor:</tspan><tspan fill="#3B4A80"> ................................... </tspan><tspan fill="#C9D6FF">VS Code · Neovim</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.67s" fill="freeze"/></text>
    <text x="300" y="292.0" fill="#00D9FF" font-weight="600" opacity="1">Stack<animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.75s" fill="freeze"/></text>
    <line x1="300" y1="299.0" x2="856" y2="299.0" stroke="#1E2A5A" stroke-width="1"><animate attributeName="x2" values="300;856" dur="0.5s" begin="1.75s" fill="freeze"/></line>
    <text x="300" y="315.5" opacity="1"><tspan fill="#7B61FF">Languages:</tspan><tspan fill="#3B4A80"> ......................... </tspan><tspan fill="#C9D6FF">JavaScript, Python, SQL</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.82s" fill="freeze"/></text>
    <text x="300" y="335.0" opacity="1"><tspan fill="#7B61FF">AI.Systems:</tspan><tspan fill="#3B4A80"> ............. </tspan><tspan fill="#C9D6FF">LangChain, Genkit, Claude SDK, RAG</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.90s" fill="freeze"/></text>
    <text x="300" y="354.5" opacity="1"><tspan fill="#7B61FF">Frontend:</tspan><tspan fill="#3B4A80"> ......................... </tspan><tspan fill="#C9D6FF">React, Next.js, Tailwind</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.97s" fill="freeze"/></text>
    <text x="300" y="374.0" opacity="1"><tspan fill="#7B61FF">Backend:</tspan><tspan fill="#3B4A80"> .......................... </tspan><tspan fill="#C9D6FF">Node.js, Express, Prisma</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.05s" fill="freeze"/></text>
    <text x="300" y="393.5" opacity="1"><tspan fill="#7B61FF">Databases:</tspan><tspan fill="#3B4A80"> .............. </tspan><tspan fill="#C9D6FF">Firestore, Realtime DB, PostgreSQL</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.12s" fill="freeze"/></text>
    <text x="300" y="413.0" opacity="1"><tspan fill="#7B61FF">Cloud:</tspan><tspan fill="#3B4A80"> ............................... </tspan><tspan fill="#C9D6FF">Google Cloud Platform</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.20s" fill="freeze"/></text>
    <text x="300" y="452.0" fill="#00D9FF" font-weight="600" opacity="1">Interests<animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.27s" fill="freeze"/></text>
    <line x1="300" y1="459.0" x2="856" y2="459.0" stroke="#1E2A5A" stroke-width="1"><animate attributeName="x2" values="300;856" dur="0.5s" begin="2.27s" fill="freeze"/></line>
    <text x="300" y="475.5" opacity="1"><tspan fill="#7B61FF">Building:</tspan><tspan fill="#3B4A80"> ................ </tspan><tspan fill="#C9D6FF">Agentic systems, LLM tooling, RAG</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.35s" fill="freeze"/></text>
    <text x="300" y="495.0" opacity="1"><tspan fill="#7B61FF">Open.Source:</tspan><tspan fill="#3B4A80"> ....................... </tspan><tspan fill="#C9D6FF">Samagra X · C4GT squads</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.43s" fill="freeze"/></text>
    <text x="300" y="514.5" opacity="1"><tspan fill="#7B61FF">Offline:</tspan><tspan fill="#3B4A80"> ................. </tspan><tspan fill="#C9D6FF">UI/UX design, YouTube, doodle art</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.50s" fill="freeze"/></text>
  </g>

  <rect x="10" y="48" width="880" height="70" fill="url(#sweep)">
    <animate attributeName="y" values="-70;588.0;-70" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="44" y="552.0" font-family="ui-monospace,'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13.5">
    <tspan fill="#00D9FF">abraham@jeron</tspan><tspan fill="#C9D6FF">:</tspan><tspan fill="#7B61FF">~</tspan><tspan fill="#C9D6FF">$ </tspan>
  </text>
  <rect x="182" y="541.0" width="8" height="14" fill="#FF4B91">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
