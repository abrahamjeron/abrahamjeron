<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600.0"
     viewBox="0 0 900 600.0" role="img" aria-label="abraham@jeron neofetch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B1E"/><stop offset="100%" stop-color="#0A0E27"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#7B61FF;#FF4B91;#00D9FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#FF4B91;#00D9FF;#7B61FF" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="artmask">
      <rect x="38" y="160" width="260" height="130">
        <animate attributeName="width" values="0;260" dur="1.1s" begin="0.9s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </clipPath>
    <clipPath id="cmd">
      <rect x="40" y="66" width="215" height="22">
        <animate attributeName="width" values="0;215" dur="0.85s" begin="0.15s" fill="freeze" calcMode="discrete"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#00D9FF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="win"><rect x="10" y="10" width="880" height="578.0" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect x="10" y="10" width="880" height="578.0" fill="url(#bg)"/>
    <rect x="10" y="10" width="880" height="578.0" fill="url(#grid)"/>
    <rect x="10" y="10" width="880" height="38" fill="#101A3D"/>
  </g>
  <rect x="10" y="10" width="880" height="578.0" rx="12" fill="none" stroke="#1E2A5A" stroke-width="1.5"/>
  <line x1="10" y1="48" x2="890" y2="48" stroke="#1E2A5A" stroke-width="1.5"/>
  <circle cx="34" cy="29" r="6" fill="#FF5F57"/><circle cx="54" cy="29" r="6" fill="#FEBC2E"/><circle cx="74" cy="29" r="6" fill="#28C840"/>
  <text x="450" y="34" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="12.5" fill="#3B4A80">abraham@jeron: ~</text>

  <g clip-path="url(#cmd)"><text x="44" y="82" font-family="ui-monospace,'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13.5">
    <tspan fill="#00D9FF">abraham@jeron</tspan><tspan fill="#C9D6FF">:</tspan><tspan fill="#7B61FF">~</tspan><tspan fill="#C9D6FF">$ neofetch</tspan>
  </text></g>

  <g font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="14.5" fill="url(#ink)"
     filter="url(#glow)" xml:space="preserve" clip-path="url(#artmask)">
    <text x="44" y="178">░█▀█░█▀▄░█▀▄░█▀█░█░█░█▀█░█▄█</text>
    <text x="44" y="193">░█▀█░█▀▄░█▀▄░█▀█░█▀█░█▀█░█░█</text>
    <text x="44" y="208">░▀░▀░▀▀░░▀░▀░▀░▀░▀░▀░▀░▀░▀░▀</text>
    <text x="44" y="223"></text>
    <text x="44" y="238">░░░░░▀▀█░█▀▀░█▀▄░█▀█░█▀█░░░░</text>
    <text x="44" y="253">░░░░░░░█░█▀▀░█▀▄░█░█░█░█░░░░</text>
    <text x="44" y="268">░░░░░▀▀░░▀▀▀░▀░▀░▀▀▀░▀░▀░░░░</text>
  </g>

