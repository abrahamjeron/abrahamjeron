<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="ABRAHAM JERON">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B1E"/>
      <stop offset="55%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#101A3D"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="55%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF4B91"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00D9FF" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="860" height="280" fill="url(#sky)"/>
  <rect width="860" height="280" fill="url(#grid)"/>

  <!-- starfield -->
  <g fill="#C9D6FF">
    <circle cx="62" cy="46" r="1.2" opacity=".7"/>
    <circle cx="196" cy="28" r="0.9" opacity=".45"/>
    <circle cx="330" cy="52" r="1.4" opacity=".8"/>
    <circle cx="500" cy="24" r="0.8" opacity=".4"/>
    <circle cx="648" cy="44" r="1.1" opacity=".6"/>
    <circle cx="782" cy="30" r="1.3" opacity=".75"/>
    <circle cx="106" cy="238" r="1" opacity=".5"/>
    <circle cx="286" cy="252" r="1.3" opacity=".65"/>
    <circle cx="560" cy="244" r="0.9" opacity=".45"/>
    <circle cx="736" cy="256" r="1.2" opacity=".6"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#00D9FF" stroke-width="2" stroke-opacity="0.85">
    <path d="M16 44V16h34"/>
    <path d="M844 44V16h-34"/>
    <path d="M16 236v28h34"/>
    <path d="M844 236v28h-34"/>
  </g>

  <text x="430" y="52" fill="#7B61FF" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="13" letter-spacing="5" text-anchor="middle" opacity="0.9">SYS.LINK ESTABLISHED</text>

  <g font-family="'DejaVu Sans Mono','JetBrains Mono','Courier New',monospace" font-size="23"
     fill="url(#ink)" filter="url(#glow)" xml:space="preserve">
    <text x="80" y="120" textLength="700" lengthAdjust="spacingAndGlyphs">░█▀█░█▀▄░█▀▄░█▀█░█░█░█▀█░█▄█░░░▀▀█░█▀▀░█▀▄░█▀█░█▀█</text>
    <text x="80" y="143" textLength="700" lengthAdjust="spacingAndGlyphs">░█▀█░█▀▄░█▀▄░█▀█░█▀█░█▀█░█░█░░░░░█░█▀▀░█▀▄░█░█░█░█</text>
    <text x="80" y="166" textLength="700" lengthAdjust="spacingAndGlyphs">░▀░▀░▀▀░░▀░▀░▀░▀░▀░▀░▀░▀░▀░▀░░░▀▀░░▀▀▀░▀░▀░▀▀▀░▀░▀</text>
  </g>

  <path d="M120 196H740" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.35"/>

  <text x="430" y="224" fill="#C9D6FF" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="15" letter-spacing="2.5" text-anchor="middle">
    FULL STACK ENGINEER <tspan fill="#00D9FF">//</tspan> BUILDING AI-POWERED WEB TOOLS
  </text>

  <rect width="860" height="280" fill="url(#scan)"/>
</svg>
