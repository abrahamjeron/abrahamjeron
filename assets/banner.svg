<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="ABRAHAM JERON">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B1E"/>
      <stop offset="55%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#101A3D"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#7B61FF;#FF4B91;#00D9FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#FF4B91;#00D9FF;#7B61FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF4B91">
        <animate attributeName="stop-color" values="#FF4B91;#00D9FF;#7B61FF;#FF4B91" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#00D9FF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.16"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="win"><rect x="10" y="10" width="880" height="240" rx="12"/></clipPath>
    <clipPath id="reveal">
      <rect x="60" y="70" height="120" width="780">
        <animate attributeName="width" values="0;780" dur="1.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect x="10" y="10" width="880" height="240" fill="url(#sky)"/>
    <rect x="10" y="10" width="880" height="240" fill="url(#grid)"/>

    <g fill="#C9D6FF">
      <circle cx="82" cy="52" r="1.2" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="216" cy="36" r="0.9" opacity=".45"><animate attributeName="opacity" values=".45;.1;.45" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="58" r="1.4" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="32" r="0.8" opacity=".4"><animate attributeName="opacity" values=".4;.08;.4" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="668" cy="50" r="1.1" opacity=".6"><animate attributeName="opacity" values=".6;.12;.6" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="802" cy="38" r="1.3" opacity=".75"><animate attributeName="opacity" values=".75;.2;.75" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="126" cy="218" r="1" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="306" cy="230" r="1.3" opacity=".65"><animate attributeName="opacity" values=".65;.15;.65" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="224" r="0.9" opacity=".45"><animate attributeName="opacity" values=".45;.1;.45" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="756" cy="234" r="1.2" opacity=".6"><animate attributeName="opacity" values=".6;.14;.6" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <text x="450" y="60" fill="#7B61FF" font-family="ui-monospace,'JetBrains Mono','DejaVu Sans Mono',monospace"
          font-size="13" letter-spacing="5" text-anchor="middle" opacity="0.95">SYS.LINK ESTABLISHED
      <animate attributeName="opacity" values="0;0.95" dur="0.6s" begin="0.2s" fill="freeze"/>
      <animate attributeName="opacity" values="0.95;0.45;0.95" dur="3.4s" begin="1.6s" repeatCount="indefinite"/>
    </text>

    <g clip-path="url(#reveal)">
      <g font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="23"
         fill="url(#ink)" filter="url(#glow)" xml:space="preserve">
        <text x="100" y="120" textLength="700" lengthAdjust="spacingAndGlyphs">░█▀█░█▀▄░█▀▄░█▀█░█░█░█▀█░█▄█░░░▀▀█░█▀▀░█▀▄░█▀█░█▀█</text>
        <text x="100" y="143" textLength="700" lengthAdjust="spacingAndGlyphs">░█▀█░█▀▄░█▀▄░█▀█░█▀█░█▀█░█░█░░░░░█░█▀▀░█▀▄░█░█░█░█</text>
        <text x="100" y="166" textLength="700" lengthAdjust="spacingAndGlyphs">░▀░▀░▀▀░░▀░▀░▀░▀░▀░▀░▀░▀░▀░▀░░░▀▀░░▀▀▀░▀░▀░▀▀▀░▀░▀</text>
      </g>
    </g>

    <path d="M140 196H760" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="620" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="620;0" dur="1.2s" begin="1.2s" fill="freeze"/>
    </path>

    <text x="450" y="224" fill="#C9D6FF" font-family="ui-monospace,'JetBrains Mono','DejaVu Sans Mono',monospace"
          font-size="15" letter-spacing="2.5" text-anchor="middle" opacity="1">
      AI <tspan fill="#00D9FF">//</tspan> AGENTIC SYSTEMS <tspan fill="#00D9FF">//</tspan> FULL STACK ENGINEER
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.9s" fill="freeze"/>
    </text>

    <!-- CRT sweep -->
    <rect x="10" y="10" width="880" height="60" fill="url(#sweep)" opacity="0.7">
      <animate attributeName="y" values="-60;250" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="10" width="880" height="240" fill="url(#scan)"/>
  </g>

  <g fill="none" stroke="#00D9FF" stroke-width="2" stroke-opacity="0.85">
    <path d="M26 54V26h34"/><path d="M874 54V26h-34"/>
    <path d="M26 206v28h34"/><path d="M874 206v28h-34"/>
  </g>
  <rect x="10" y="10" width="880" height="240" rx="12" fill="none" stroke="#1E2A5A" stroke-width="1.5"/>
</svg>
